<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team tasks · Make-It-All Hub</title>
    <link rel="stylesheet" href="team-tasks.css">
</head>
<body>

    <!-- Dark Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">Make-It-All Hub</div>
        <nav class="sidebar-nav">
            <a href="../home/home.html" class="nav-item">Home</a>
            <a href="../my-tasks/my-tasks.html" class="nav-item">My tasks</a>
            <a href="../team-tasks/team-tasks.html" class="nav-item active">Team tasks</a>
            <a href="../knowledge-base/knowledge-base.html" class="nav-item">Knowledge Base</a>
        </nav>
        <!-- Logged-in user, filled in by shared/session.js -->
        <div class="sidebar-user">
            <span class="sidebar-user-name" id="sidebar-user-name"></span>
            <span class="sidebar-user-email" id="sidebar-user-email"></span>
            <button type="button" class="sidebar-logout" id="logout-btn">Log out</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="content-header">
            <div>
                <h1>Make-It-All Dashboard</h1>
                <div class="date-sub">Productivity Management System</div>
            </div>
        </header>

        <div class="container">
            <!-- Project Tasks Section -->
            <div class="card">
                <h2>Team/Project Tasks</h2>
                <div class="form-group">
                    <label for="taskInput">New Task Description:</label>
                    <input type="text" id="taskInput" placeholder="Enter task details...">
                </div>
                <div class="form-group">
                    <label for="ownerInput">Assign To Team Member:</label>
                    <input type="text" id="ownerInput" placeholder="Enter team member name...">
                </div>
                <button class="primary" id="addTaskButton">Add Task</button>

                <h3>Current Tasks</h3>
                <ul id="taskList">
                    <!-- Dynamically populated by JS -->
                </ul>
            </div>

            <!-- Workload Summary Section -->
            <div class="card">
                <h2>Workload Summary</h2>
                <p>Active tasks currently assigned to team members:</p>
                <ul id="workList">
                    <!-- Dynamically populated by JS -->
                </ul>
            </div>
        </div>
    </main>

    <script src="../shared/session.js"></script>
    <script src="team-tasks.js"></script>
</body>
</html>
