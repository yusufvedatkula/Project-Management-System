<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My tasks · Make-It-All Hub</title>
  <link rel="stylesheet" href="my-tasks.css">
</head>
<body>

  <div class="app">

    <!-- Same sidebar as the other pages; user details filled in by shared/session.js -->
    <nav class="sidebar" aria-label="Main navigation">
      <div class="logo">Make-It-All Hub</div>
      <a class="active" href="my-tasks.html" aria-current="page">My tasks</a>
      <a href="../team-tasks/team-tasks.html">Team tasks</a>
      <a href="../knowledge-base/knowledge-base.html">Knowledge Base</a>
      <a href="../managers-dashboard/managers-dashboard.html">Manager's dashboard</a>

      <div class="sidebar-user">
        <span class="sidebar-user-name" id="sidebar-user-name"></span>
        <span class="sidebar-user-email" id="sidebar-user-email"></span>
        <button type="button" class="sidebar-logout" id="logout-btn">Log out</button>
      </div>
    </nav>

    <main class="content">
    <header class="page-header">
      <div class="page-title">
        <p id="today_date" class="today"></p>
        <h1>My tasks</h1>
      </div>
      <div class="counters">
        <div class="counter"><strong id="count-open">0</strong>open</div>
        <div class="counter overdue"><strong id="count-overdue">0</strong>overdue</div>
        <div class="counter done"><strong id="count-done">0</strong>done</div>
        </div>
    </header>

    <!-- each box has a small label above it saying what it is for -->
    <div class="adding_task">
      <label class="field field-grow">
        <span class="field-label">Task</span>
        <input type="text" id="newTask_input" placeholder="What needs doing?">
      </label>

      <label class="field">
        <span class="field-label">Project</span>
        <select id="project_select">
        <option value="Personal" selected>Personal</option>
        <option value="Client portal v2">Client portal v2</option>
        <option value="Office IT refresh">Office IT refresh</option>
        <option value="HR onboarding">HR onboarding</option>
        <option value="Team coordination">Team coordination</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">Priority</span>
        <select id="priority_select">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
      </label>

      <!-- same three levels as Team tasks and the Manager's dashboard -->
      <label class="field" title="Easy: routine, clear steps. Medium: needs some specialist knowledge or a decision. Hard: specialist skills, unknowns or several people involved.">
        <span class="field-label">Complexity</span>
        <select id="complexity_select">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">Estimated hours</span>
        <input type="number" id="hours_input" placeholder="e.g. 2" min="0.5" step="0.5">
      </label>

      <label class="field">
        <span class="field-label">Due date</span>
        <input type="date" id="due_input">
      </label>

      <button id="adding_task_btn">Add task</button>
    </div>

    <div class="filters">
      <!-- a task is either open or done (ticked), so these are the only filters needed -->
      <button class="filter_btn ready" data-filter="All">All</button>
      <button class="filter_btn" data-filter="Open">Open</button>
      <button class="filter_btn" data-filter="Done">Completed</button>

      <select id="priority_filter">
        <option value="All">All priorities</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>

      <select id="complexity_filter" aria-label="Filter by complexity">
        <option value="All">All complexities</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label class="sort_wrap">
        Sort by
        <select id="sort_select">
          <option value="due" selected>Due date</option>
          <option value="priority">Priority</option>
          <option value="complexity">Complexity</option>
          <option value="hours">Estimated hours</option>
        </select>
      </label>
    </div>

      <!-- ul is empty because tasks are dynamically added via JavaScript -->
      <ul id="task-list"></ul>
    </main>

  </div>
  <script src="../shared/session.js"></script>
  <script src="my-tasks.js"></script>
</body>
</html>
