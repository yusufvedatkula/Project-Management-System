<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My tasks · Make-It-All Hub</title>
  <link rel="stylesheet" href="my-tasks.css">
</head>
<body>

  <div class="app">

    <nav class="sidebar">
      <div class="logo">Make-It-All Hub</div>
      <a href="../home/home.html">Home</a>
      <a class="active" href="../my-tasks/my-tasks.html">My tasks</a>
      <a href="../team-tasks/team-tasks.html">Team tasks</a>
      <a href="../knowledge-base/knowledge-base.html">Knowledge Base</a>

      <!-- Logged-in user, filled in by shared/session.js -->
      <div class="sidebar-user">
        <span class="sidebar-user-name" id="sidebar-user-name"></span>
        <span class="sidebar-user-email" id="sidebar-user-email"></span>
        <button type="button" class="sidebar-logout" id="logout-btn">Log out</button>
      </div>
    </nav>

    <main class="content">
      <header class="page-header">
      <h1>My tasks</h1>
      <div class="counters">
        <div class="counter"><strong id="count-open">0</strong>open</div>
        <div class="counter overdue"><strong id="count-overdue">0</strong>overdue</div>
        <div class="counter done"><strong id="count-done">0</strong>done</div>
        <div class="counter high-priority"><strong id="count-high-priority">0</strong>high priority</div>
        </div>
    </header>

    <div class="adding_task">
      <input type="text" id="newTask_input" placeholder="Add a new task">
      <select id="priority_select" aria-label="Priority">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      <button id="adding_task_btn">Add task</button>
    </div>

    <div class="filters">
      <button class="filter_btn ready" data-filter="All">All</button>
      <button class="filter_btn" data-filter="To do">To do</button>
      <button class="filter_btn" data-filter="In progress">In progress</button>
      <button class="filter_btn" data-filter="Done">Done</button>
    </div>

      <!-- ul is empty because tasks are dynamically added via JavaScript -->
      <ul id="task-list"></ul>
    </main>

  </div>
  <script src="../shared/session.js"></script>
  <script src="my-tasks.js"></script>
</body>
</html>
