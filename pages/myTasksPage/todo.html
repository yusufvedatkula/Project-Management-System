<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My tasks · Make-It-All Hub</title>
  <link rel="stylesheet" href="todo.css">
</head>
<body>

  <div class="app">

    <nav class="sidebar">
      <div class="logo">Make-It-All Hub</div>
      <a class="active" href="todo.html">My tasks</a>
      <a href="knowledge.html">Knowledge Base</a>
    </nav>

    <main class="content">
      <header class="page-header">
      <h1>My tasks</h1>
      <div class="counters">
        <div class="counter"><strong id="count-open">0</strong>open</div>
        <div class="counter overdue"><strong id="count-overdue">0</strong>overdue</div>
        <div class="counter done"><strong id="count-done">0</strong>done</div>
        <div class="counter high-priority"><strong id="count-high-priority">0</strong>high priority</div>
        </div>
    </header>

        <div class="adding_task">
      <input type="text" id="newTask_input" placeholder="Add a task, e.g. Book room for sprint review">

      <select id="project_select">
        <option value="Personal" selected>Personal</option>
        <option value="Client portal v2">Client portal v2</option>
        <option value="Office IT refresh">Office IT refresh</option>
        <option value="HR onboarding">HR onboarding</option>
        <option value="Team coordination">Team coordination</option>
      </select>

      <select id="priority_select">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>

      <input type="date" id="due_input">

      <button id="adding_task_btn">Add task</button>
    </div>

    <div class="filters">
      <button class="filter_btn ready" data-filter="All">All</button>
      <button class="filter_btn" data-filter="To do">To do</button>
      <button class="filter_btn" data-filter="In progress">In progress</button>
      <button class="filter_btn" data-filter="Done">Done</button>

      <select id="priority_filter">
        <option value="All">All priorities</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>

      <label class="sort_wrap">
        Sort by
        <select id="sort_select">
          <option value="due" selected>Due date</option>
          <option value="priority">Priority</option>
          <option value="status">Status</option>
        </select>
      </label>
    </div>

      <!-- ul is empty because tasks are dynamically added via JavaScript -->
      <ul id="task-list"></ul>
    </main>

  </div>
  <script src="todo.js"></script>
</body>
</html>
